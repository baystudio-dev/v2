name: v2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop runtime verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: |
          node --check server.js
          node --check cli.js

      - name: Enforce managed-engine policy
        shell: bash
        run: |
          set -euo pipefail
          WORKSTATION=android/app/src/main/java/com/bossbayu/aiteam/runtime/WorkstationManager.kt

          if grep -Eiq 'ANTIGRAVITY_VERSION|antigravity-public|bin/agy|File\(binDir, "agy"\)' "$WORKSTATION"; then
            echo "Managed Antigravity provisioning is prohibited by project policy." >&2
            exit 1
          fi

          for needle in \
            'execFile("agy"' \
            "execFile('agy'" \
            'spawn("agy"' \
            "spawn('agy'" \
            'spawnSync("agy"' \
            "spawnSync('agy'" \
            'spawnEngine("agy"' \
            "spawnEngine('agy'"; do
            if grep -Fq "$needle" server.js; then
              echo "Backend must not invoke Antigravity CLI as a managed engine: $needle" >&2
              exit 1
            fi
          done

      - name: Runtime doctor
        run: npm run doctor

      - name: Backend smoke test
        run: npm test

      - name: Verify npm dependency health
        run: npm audit --audit-level=high

  android:
    name: Android API 36 · ${{ matrix.runtime_abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime_abi: [arm64-v8a, x86_64]
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android sdkmanager
        id: android-sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -uo pipefail
          yes | "${{ steps.android-sdk.outputs.sdkmanager }}" --licenses >/dev/null || true

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.android-sdk.outputs.sdkmanager }}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -d "$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Lint and assemble debug APK
        working-directory: android
        run: gradle --no-daemon --console=plain -PruntimeAbi=${{ matrix.runtime_abi }} lintDebug assembleDebug

      - name: Verify APK and 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report-${{ matrix.runtime_abi }}
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-ai-team-v2-debug-${{ matrix.runtime_abi }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-runtime-smoke:
    name: Android 36 runtime smoke · x86_64
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout smoke test script
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download x86_64 debug APK
        uses: actions/download-artifact@v4
        with:
          name: whatsapp-ai-team-v2-debug-x86_64
          path: runtime-apk

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo "KVM device is not available on the runner" >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Some GitHub runners apply udev permissions asynchronously.
          # /dev/kvm is runner-local and this change never touches a user device.
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "KVM udev permission not ready; applying runner-local fallback"
            sudo chmod 0666 /dev/kvm
          fi
          for attempt in 1 2 3 4 5; do
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then break; fi
            sleep 1
          done
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "KVM device remains inaccessible after permission fallback" >&2
            ls -l /dev/kvm >&2
            exit 1
          fi
          ls -l /dev/kvm

      - name: Boot Android 36 and verify embedded backend
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          # The action runs each script line as its own sh -c invocation;
          # use one Bash process to preserve APK, ready, and trap state.
          script: CP16_PROOT_TEST=1 bash scripts/qa/android-emulator-smoke.sh

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-smoke-evidence
          path: |
            runtime-status.json
            runtime-restart-status.json
            runtime-team.json
            runtime-logcat.txt
            runtime-proot-crash-logcat.txt
            runtime-activities.txt
            runtime-services.txt
            runtime-package.txt
          if-no-files-found: ignore
          retention-days: 7
